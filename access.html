<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès — Mariage Florence &amp; Antoine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Manrope, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #4a0b14;
      background:
        radial-gradient(1200px 520px at 50% -12%, rgba(255,255,255,0.36), rgba(255,255,255,0) 62%),
        radial-gradient(980px 460px at 8% 6%, rgba(240,63,89,0.22), rgba(240,63,89,0) 62%),
        radial-gradient(980px 460px at 92% 2%, rgba(246,93,8,0.22), rgba(246,93,8,0) 64%),
        #fff3f2;
    }

    .card {
      background: linear-gradient(150deg, rgba(255,255,255,0.94), rgba(255,225,223,0.84));
      border: 1px solid rgba(224,10,38,0.45);
      border-radius: 28px;
      box-shadow: 0 16px 28px rgba(224,10,38,0.2);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .icon { font-size: 2.5rem; margin-bottom: 1rem; }

    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #4a0b14;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #8f2b37;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border: 1.5px solid rgba(224,10,38,0.45);
      border-radius: 18px;
      font-size: 1.1rem;
      font-family: Manrope, sans-serif;
      letter-spacing: 0.1em;
      text-align: center;
      outline: none;
      background: rgba(255,255,255,0.7);
      color: #4a0b14;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
      border-color: #e00a26;
      box-shadow: 0 0 0 3px rgba(224,10,38,0.12);
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      background: linear-gradient(145deg, #ffbd1c, #e00a26);
      color: #fff;
      font-family: Manrope, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(224,10,38,0.32);
      transition: transform 0.15s, filter 0.15s, opacity 0.15s;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: saturate(1.08);
    }

    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      background: rgba(224,10,38,0.08);
      color: #e00a26;
      border-radius: 12px;
      font-size: 0.88rem;
      display: none;
    }

    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💍</div>
    <h1>Florence &amp; Antoine</h1>
    <p class="subtitle">Entrez le code d'accès pour accéder au site.</p>
    <form id="accessForm" autocomplete="off">
      <input type="text" id="codeInput" placeholder="Code d'accès" autocomplete="off" spellcheck="false" inputmode="text" autofocus>
      <button type="submit" class="btn" id="submitBtn">Accéder</button>
      <div class="error" id="errorMsg">Code incorrect. Veuillez réessayer.</div>
    </form>
  </div>

  <script>
    const form = document.getElementById('accessForm');
    const input = document.getElementById('codeInput');
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = input.value.trim();
      if (!code) return;

      btn.disabled = true;
      errorMsg.classList.remove('visible');

      try {
        const res = await fetch('/api/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.replace('/');
        } else {
          errorMsg.classList.add('visible');
          input.select();
        }
      } catch {
        errorMsg.textContent = 'Erreur réseau. Veuillez réessayer.';
        errorMsg.classList.add('visible');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
