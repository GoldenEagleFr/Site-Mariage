<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan des chambres — Florence &amp; Antoine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Layout ──────────────────────────────────────────────── */
    .ch-app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .ch-topbar {
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px; height: 52px; flex-shrink: 0;
      background: var(--ink); color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      z-index: 20;
    }
    .ch-topbar-title { font: 700 1rem 'Manrope',sans-serif; color: #fff; white-space: nowrap; }
    .ch-back-btn {
      color: rgba(255,255,255,.75); font-size: 0.82rem; font-weight: 700;
      text-decoration: none; white-space: nowrap;
      padding: 4px 8px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.25);
      transition: background .15s;
    }
    .ch-back-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
    .ch-sep { width: 1px; height: 22px; background: rgba(255,255,255,.2); flex-shrink: 0; }
    .ch-stats-bar {
      display: flex; gap: 16px; font-size: 0.78rem; color: rgba(255,255,255,.8);
      flex: 1; overflow: hidden;
    }
    .ch-stat { white-space: nowrap; }
    .ch-stat strong { color: #fff; }
    .ch-sync { font-size: 0.72rem; color: rgba(255,255,255,.55); white-space: nowrap; }

    /* ── Corps ───────────────────────────────────────────────── */
    .ch-body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar invités ─────────────────────────────────────── */
    .ch-sidebar {
      width: 200px; flex-shrink: 0;
      display: flex; flex-direction: column;
      background: var(--card); border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .ch-sidebar-head {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ch-sidebar-head h3 {
      margin: 0 0 6px; font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: .05em; color: var(--ink-soft);
    }
    .ch-sidebar-search {
      width: 100%; box-sizing: border-box;
      font: 0.82rem 'Manrope',sans-serif;
      padding: 4px 8px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg); color: var(--ink);
      box-shadow: none;
    }
    .ch-guest-list { overflow-y: auto; flex: 1; padding: 6px; }
    .ch-guest-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-radius: 8px;
      cursor: pointer; font-size: 0.82rem; font-weight: 600;
      color: var(--ink); border: 1.5px solid transparent;
      transition: background .12s, border-color .12s;
      margin-bottom: 3px;
    }
    .ch-guest-item:hover { background: var(--surface-alt); }
    .ch-guest-item.is-selected {
      background: rgba(240,63,89,.1);
      border-color: var(--rose);
      color: var(--rose);
    }
    .ch-guest-item.is-placed {
      opacity: .45; cursor: default;
      text-decoration: line-through;
    }
    .ch-guest-item.is-placed:hover { background: transparent; }
    .ch-guest-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--rose); flex-shrink: 0;
    }
    .ch-guest-item.is-placed .ch-guest-dot { background: #22c55e; }
    .ch-guest-cat {
      font-size: 0.68rem; color: var(--ink-soft);
      font-weight: 500; margin-left: auto;
    }
    .ch-sidebar-empty {
      padding: 16px 12px; font-size: 0.82rem;
      color: var(--ink-soft); text-align: center; font-style: italic;
    }

    /* ── Zone principale (carte) ────────────────────────────────── */
    .ch-main { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0; }
    .ch-map-wrap {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      background: #e8e3dc; padding: 12px; box-sizing: border-box;
    }
    .ch-map-inner {
      position: relative;
      aspect-ratio: 4 / 3;
      max-width: 100%; max-height: 100%;
      width: 100%;
    }
    .ch-map-img {
      width: 100%; height: 100%; display: block;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.22);
    }
    .ch-map-hotspots { position: absolute; inset: 0; border-radius: 10px; }
    .ch-map-hotspot {
      position: absolute;
      cursor: pointer; border-radius: 6px; overflow: hidden;
      transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
      transform-origin: center; z-index: 1;
    }
    .ch-map-hotspot:hover { transform: scale(1.1); box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 10; }
    .ch-map-hotspot-bg {
      position: absolute; inset: 0;
      background: url(PLAN-DES-DOMAINES-AQUARELLE.jpg) no-repeat;
      pointer-events: none;
    }

    /* ── Modal bâtiment ──────────────────────────────────────────── */
    .ch-modal {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .ch-modal.is-hidden { display: none; }
    .ch-modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(10,8,6,.52); backdrop-filter: blur(2px);
    }
    .ch-modal-panel {
      position: relative; z-index: 1;
      background: var(--card); border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      width: 100%; max-width: 720px;
      max-height: calc(100vh - 40px);
      display: flex; flex-direction: column; overflow: hidden;
      animation: modal-in .22s cubic-bezier(.34,1.32,.64,1) both;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(.93) translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .ch-modal-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .ch-modal-title { font: 700 1.05rem 'Manrope',sans-serif; color: var(--ink); flex: 1; }
    .ch-modal-close {
      background: none; border: 1px solid var(--border);
      color: var(--ink-soft); border-radius: 8px;
      padding: 4px 10px; font-size: 0.8rem; cursor: pointer;
      box-shadow: none; transition: background .12s, color .12s;
    }
    .ch-modal-close:hover { background: var(--surface-alt); color: var(--ink); box-shadow: none; transform: none; filter: none; }
    .ch-modal-rooms { overflow-y: auto; padding: 16px 20px; flex: 1; }
    .ch-modal-rooms .ch-rooms-grid { margin-bottom: 16px; }

    /* Onglets bâtiments */
    .ch-building-tabs {
      display: flex; gap: 6px; margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .ch-building-tab {
      padding: 7px 16px; border-radius: 20px;
      font: 600 0.82rem 'Manrope',sans-serif;
      border: 1.5px solid var(--border);
      background: var(--card); color: var(--ink-soft);
      cursor: pointer; transition: all .15s;
    }
    .ch-building-tab:hover { border-color: var(--rose); color: var(--rose); }
    .ch-building-tab.is-active {
      background: var(--ink); color: #fff; border-color: var(--ink);
    }
    .ch-building-section { display: none; }
    .ch-building-section.is-active { display: block; }

    /* Sous-section (étage / chalet) */
    .ch-floor-title {
      font: 700 0.72rem 'Manrope',sans-serif;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--ink-soft); margin: 18px 0 10px;
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .ch-floor-title:first-child { margin-top: 0; }

    /* Grille de chambres */
    .ch-rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 8px;
    }

    /* Carte chambre */
    .ch-room-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 12px; padding: 12px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .12s ease;
      position: relative;
    }
    .ch-room-card:hover { border-color: var(--rose); box-shadow: 0 4px 14px rgba(240,63,89,.12); }
    .ch-room-card.is-full { border-color: #22c55e; cursor: default; }
    .ch-room-card.is-full:hover { border-color: #22c55e; box-shadow: none; }
    .ch-room-card.can-drop {
      border-color: var(--rose); border-style: dashed;
      box-shadow: 0 0 0 3px rgba(240,63,89,.15);
      animation: pulse-border .8s ease-in-out infinite alternate;
    }
    @keyframes pulse-border {
      from { box-shadow: 0 0 0 2px rgba(240,63,89,.15); }
      to   { box-shadow: 0 0 0 5px rgba(240,63,89,.28); }
    }

    .ch-room-name {
      font: 700 0.88rem 'Manrope',sans-serif;
      color: var(--ink); margin: 0 0 3px;
    }
    .ch-room-beds {
      font-size: 0.73rem; color: var(--ink-soft);
      margin: 0 0 8px;
    }
    .ch-room-capacity {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 8px;
    }
    .ch-room-bar-wrap {
      flex: 1; height: 5px; background: var(--border);
      border-radius: 99px; overflow: hidden;
    }
    .ch-room-bar {
      height: 100%; border-radius: 99px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      background: var(--rose);
      transition: width .3s ease;
    }
    .ch-room-bar.is-full { background: #22c55e; }
    .ch-room-cap-label {
      font: 600 0.72rem 'Manrope',sans-serif;
      color: var(--ink-soft); white-space: nowrap;
    }
    .ch-room-badge-full {
      position: absolute; top: 8px; right: 8px;
      font-size: 0.65rem; font-weight: 700;
      background: #22c55e; color: #fff;
      padding: 2px 6px; border-radius: 99px;
    }
    .ch-room-sdb {
      font-size: 0.68rem; color: var(--ink-soft);
      margin-bottom: 8px;
    }

    /* Occupants dans la chambre */
    .ch-room-occupants { display: flex; flex-direction: column; gap: 3px; }
    .ch-occupant-row {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.78rem; font-weight: 600; color: var(--ink);
    }
    .ch-occupant-remove {
      margin-left: auto; background: none; border: none;
      color: var(--ink-soft); cursor: pointer; font-size: 0.8rem;
      padding: 0 2px; line-height: 1; box-shadow: none; transform: none;
      transition: color .12s;
    }
    .ch-occupant-remove:hover { color: var(--danger); box-shadow: none; transform: none; filter: none; }

    /* Chambre des mariés */
    .ch-room-card.is-bridal {
      border-color: var(--gold-dark);
      background: linear-gradient(135deg, rgba(255,189,28,.06), rgba(224,10,38,.04));
    }
    .ch-room-card.is-bridal .ch-room-name::after {
      content: " 💍"; font-size: 0.8em;
    }

    /* Grille extérieure pour les blocs chalets */
    .ch-rooms-grid[data-floor="chalets-a"],
    .ch-rooms-grid[data-floor="chalets-b"] {
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }

    /* Bloc par chalet */
    .ch-chalet-block {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      background: var(--card);
      transition: border-color .15s;
    }
    .ch-chalet-block.is-full { border-color: #22c55e; }
    .ch-chalet-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .ch-chalet-name { font: 700 0.85rem 'Manrope',sans-serif; color: var(--ink); }
    .ch-chalet-cap  { font: 600 0.72rem 'Manrope',sans-serif; color: var(--ink-soft); }
    .ch-chalet-rooms { display: grid; gap: 6px; }

    /* Carte de sous-chambre dans un bloc chalet */
    .ch-room-card.is-compact { padding: 8px 8px 6px; border-radius: 9px; }
    .ch-room-card.is-compact .ch-room-sdb { display: none; }

    /* Drag and drop */
    .ch-guest-item { cursor: grab; }
    .ch-guest-item.is-dragging,
    .ch-occupant-row.is-dragging { opacity: 0.35; cursor: grabbing; }
    .ch-occupant-row[draggable="true"] { cursor: grab; }
    .ch-room-card.drag-over {
      border-color: var(--rose) !important;
      border-style: dashed !important;
      box-shadow: 0 4px 16px rgba(240,63,89,.18);
      transform: scale(1.025);
    }

    /* Animations */
    @keyframes ch-card-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ch-flash-green {
      0%, 100% { background: var(--card); }
      30%      { background: rgba(34,197,94,.18); box-shadow: 0 0 0 4px rgba(34,197,94,.22); }
    }
    @keyframes ch-flash-red {
      0%, 100% { background: var(--card); }
      30%      { background: rgba(220,38,38,.14); box-shadow: 0 0 0 4px rgba(220,38,38,.18); }
    }
    .ch-room-card.flash-green { animation: ch-flash-green 0.55s ease; }
    .ch-room-card.flash-red   { animation: ch-flash-red  0.50s ease; }

    /* ── Gate connexion ──────────────────────────────────────── */
    .ch-gate {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    .ch-gate-card {
      background: var(--card); border-radius: 18px;
      padding: 36px 32px; max-width: 340px; width: 90%;
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 640px) {
      .ch-sidebar { width: 160px; }
      .ch-rooms-grid { grid-template-columns: 1fr; }
      .ch-stat:nth-child(n+3) { display: none; }
    }
    @media (max-width: 480px) {
      .ch-sidebar { display: none; }
      .ch-main { padding: 10px; }
    }
  </style>
</head>
<body data-page="chambres">

<!-- Gate connexion -->
<section id="chGate" class="ch-gate">
  <div class="ch-gate-card">
    <p class="kicker">Espace privé</p>
    <h2 style="font-family:'Fraunces',serif;font-size:1.8rem;margin:8px 0 20px;">🏨 Plan des chambres</h2>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0 0 18px;">Florence &amp; Antoine · Domaines de Gaston</p>
    <form id="chLoginForm" class="row-form row-form-2 admin-login">
      <input id="chPassword" type="password" placeholder="Mot de passe administrateur" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>
    <p id="chLoginError" class="admin-error" aria-live="polite"></p>
  </div>
</section>

<!-- Application -->
<div id="chApp" class="ch-app is-hidden">

  <!-- Topbar -->
  <header class="ch-topbar">
    <a href="organisation.html" class="ch-back-btn">← Org.</a>
    <div class="ch-sep"></div>
    <span class="ch-topbar-title">🏨 Plan des chambres</span>
    <div class="ch-sep"></div>
    <div class="ch-stats-bar">
      <span class="ch-stat">Placés : <strong id="statPlaced">0</strong> / <strong id="statTotal">0</strong></span>
      <span class="ch-stat">Couchages : <strong id="statBeds">0</strong> / 106</span>
      <span class="ch-stat">Chambres pleines : <strong id="statFull">0</strong></span>
    </div>
    <span id="chSyncStatus" class="ch-sync"></span>
    <button id="chDarkToggle" class="dark-mode-toggle-btn" type="button">🌙</button>
  </header>

  <!-- Corps -->
  <div class="ch-body">

    <!-- Sidebar invités -->
    <aside class="ch-sidebar">
      <div class="ch-sidebar-head">
        <h3>🏨 Invités à placer</h3>
        <input id="chGuestSearch" class="ch-sidebar-search" type="text" placeholder="Rechercher…">
      </div>
      <div id="chGuestList" class="ch-guest-list">
        <p class="ch-sidebar-empty">Aucun invité avec hébergement.</p>
      </div>
    </aside>

    <!-- Zone principale : carte -->
    <main class="ch-main">
      <div class="ch-map-wrap">
        <div class="ch-map-inner">
          <img src="PLAN-DES-DOMAINES-AQUARELLE.jpg" class="ch-map-img" alt="Plan des Domaines de Gaston">
          <div id="chMapHotspots" class="ch-map-hotspots"></div>
        </div>
      </div>
    </main>

  </div><!-- .ch-body -->

  <!-- Modal bâtiment -->
  <div id="chBuildingModal" class="ch-modal is-hidden">
    <div class="ch-modal-backdrop" id="chModalBackdrop"></div>
    <div class="ch-modal-panel">
      <div class="ch-modal-header">
        <span id="chModalTitle" class="ch-modal-title"></span>
        <button id="chModalClose" class="ch-modal-close" type="button">✕ Fermer</button>
      </div>
      <div id="chModalRooms" class="ch-modal-rooms"></div>
    </div>
  </div>

</div><!-- #chApp -->

const SERVER_ENDPOINT   = "/api/data";
const ADMIN_CHECK       = "/api/admin/check";

// ── Utilitaires ─────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Connexion ────────────────────────────────────────────────────────────
async function tryLogin(token) {
  try {
    const r = await fetch(ADMIN_CHECK, { headers: { "X-Admin-Key": token }, cache: "no-store" });
    return r.ok;
  } catch { return false; }
}

chLoginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = chPassword.value.trim();
  if (!token) return;
  chLoginError.textContent = "Connexion…";
  const ok = await tryLogin(token);
  if (!ok) { chLoginError.textContent = "Mot de passe incorrect."; return; }
  chAdminToken  = token;
  sessionStorage.setItem(ADMIN_SESSION_KEY, token);
  chLoginError.textContent = "";
  await loadData();
  renderHotspots();
  chGate.classList.add("is-hidden");
  chApp.classList.remove("is-hidden");
  startSyncPoll();
});

// Restaurer session
const savedToken = sessionStorage.getItem(ADMIN_SESSION_KEY);
if (savedToken) {
  tryLogin(savedToken).then(ok => {
    if (!ok) return;
    chAdminToken = savedToken;
    loadData().then(() => {
      renderHotspots();
      chGate.classList.add("is-hidden");
      chApp.classList.remove("is-hidden");
      startSyncPoll();
    });
  });
}

// ── Chargement / sauvegarde ──────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch(SERVER_ENDPOINT, { cache: "no-store", headers: { "X-Admin-Key": chAdminToken } });
    if (!r.ok) return;
    const data = await r.json();
    chGuests = (data.guests || []).filter(g => !g.isHost);
    chAssign = data.roomAssignments || {};
    lastKnownUpdatedAt = data.updatedAt || 0;
    render();
  } catch (err) {
    setSyncStatus("⚠ Erreur de chargement");
  }
}

function setSyncStatus(msg) {
  if (chSyncStatus) chSyncStatus.textContent = msg;
}

let _saveDebounce = null;
function saveData() {
  syncPending = true;
  setSyncStatus("⏳ Sauvegarde…");
  if (_saveDebounce) clearTimeout(_saveDebounce);
  _saveDebounce = setTimeout(async () => {
    try {
      // On charge d'abord pour merger proprement
      const r0 = await fetch(SERVER_ENDPOINT, { cache:"no-store", headers:{"X-Admin-Key":chAdminToken} });
      const current = r0.ok ? await r0.json() : {};
      const payload = { ...current, roomAssignments: chAssign, updatedAt: Date.now() };
      const r = await fetch(SERVER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type":"application/json", "X-Admin-Key": chAdminToken },
        body: JSON.stringify(payload),
      });
      if (r.ok) {
        setSyncStatus("✓ Sauvegardé");
        lastKnownUpdatedAt = payload.updatedAt;
        syncPending = false;
        setTimeout(() => setSyncStatus(""), 2500);
      } else {
        setSyncStatus("⚠ Erreur sauvegarde");
      }
    } catch { setSyncStatus("⚠ Erreur réseau"); }
  }, 800);
}

// Sync polling (détecte les modifications depuis un autre appareil)
function startSyncPoll() {
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(async () => {
    if (syncPending) return;
    try {
      const r = await fetch(SERVER_ENDPOINT, { cache:"no-store", headers:{"X-Admin-Key":chAdminToken} });
      if (!r.ok) return;
      const data = await r.json();
      if ((data.updatedAt || 0) > lastKnownUpdatedAt) {
        chGuests = (data.guests || []).filter(g => !g.isHost);
        chAssign = data.roomAssignments || {};
        lastKnownUpdatedAt = data.updatedAt;
        render();
        setSyncStatus("🔄 Mis à jour");
        setTimeout(() => setSyncStatus(""), 2000);
      }
    } catch {}
  }, 15000);
}

// ── Assignation ──────────────────────────────────────────────────────────
function assignGuest(guestId, roomId) {
  const room = ROOM_BY_ID[roomId];
  if (!room) return;
  const occupants = Object.entries(chAssign).filter(([,rid]) => rid === roomId);
  if (occupants.length >= room.capacity) return;
  delete chAssign[guestId];
  chAssign[guestId] = roomId;
  selectedGuestId = null;
  pendingFlash = { roomId, type: "green" };
  saveData();
  render();
}

function removeGuest(guestId) {
  const roomId = chAssign[guestId];
  delete chAssign[guestId];
  if (roomId) pendingFlash = { roomId, type: "red" };
  saveData();
  render();
}

// ── Rendu ────────────────────────────────────────────────────────────────
function render() {
  renderSidebar();
  renderRooms();
  renderStats();
  if (pendingFlash) {
    const { roomId, type } = pendingFlash;
    pendingFlash = null;
    requestAnimationFrame(() => {
      const card = document.querySelector(`.ch-room-card[data-rid="${CSS.escape(roomId)}"]`);
      if (!card) return;
      card.classList.remove("flash-green", "flash-red");
      void card.offsetWidth; // force reflow
      card.classList.add(`flash-${type}`);
      card.addEventListener("animationend", () => card.classList.remove(`flash-${type}`), { once: true });
    });
  }
}

function guestCatLabel(g) {
  if (g.guestCategory === "baby")  return "🍼";
  if (g.guestCategory === "child") return "👶";
  if (g.guestCategory === "teen")  return "🧑";
  return "";
}

function renderSidebar() {
  const search = (chGuestSearch?.value || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const hebergGuests = chGuests.filter(g => g.hebergement);

  const filtered = hebergGuests.filter(g => {
    if (!search) return true;
    return g.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(search);
  });

  if (filtered.length === 0) {
    chGuestList.innerHTML = `<p class="ch-sidebar-empty">${hebergGuests.length === 0 ? "Aucun invité avec hébergement activé." : "Aucun résultat."}</p>`;
    return;
  }

  chGuestList.innerHTML = filtered.map(g => {
    const placed = chAssign[g.id];
    const isSelected = g.id === selectedGuestId;
    return `<div class="ch-guest-item${placed ? " is-placed" : ""}${isSelected ? " is-selected" : ""}"
        data-gid="${escHtml(g.id)}">
      <span class="ch-guest-dot"></span>
      <span>${escHtml(g.name)}</span>
      <span class="ch-guest-cat">${guestCatLabel(g)}</span>
    </div>`;
  }).join("");

  chGuestList.querySelectorAll(".ch-guest-item").forEach(el => {
    const gid = el.dataset.gid;

    // Clic pour sélectionner (invités non placés uniquement)
    if (!el.classList.contains("is-placed")) {
      el.addEventListener("click", () => {
        selectedGuestId = selectedGuestId === gid ? null : gid;
        renderSidebar();
        renderRooms();
      });
    }

    // Drag
    el.setAttribute("draggable", "true");
    el.addEventListener("dragstart", (e) => {
      dragGuestId = gid;
      e.dataTransfer.setData("text/plain", gid);
      e.dataTransfer.effectAllowed = "move";
      requestAnimationFrame(() => el.classList.add("is-dragging"));
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("is-dragging");
      dragGuestId = null;
      document.querySelectorAll(".ch-room-card.drag-over").forEach(c => c.classList.remove("drag-over"));
    });
  });
}

function getRoomOccupants() {
  const o = {};
  for (const [gid, rid] of Object.entries(chAssign)) {
    const g = chGuests.find(x => x.id === gid);
    if (!g) continue;
    if (!o[rid]) o[rid] = [];
    o[rid].push(g);
  }
  return o;
}

function renderRooms() {
  if (activeBuilding) renderModalRooms();
}

function renderModalRooms(animate = false) {
  if (!activeBuilding) return;
  const b   = activeBuilding;
  const occ = getRoomOccupants();
  const container = document.getElementById("chModalRooms");
  if (!container) return;

  let html = "";
  if (b.chalet) {
    const rooms = ROOMS.filter(r => r.chalet === b.chalet);
    html = chaletBlock(b.chalet, rooms, occ);
  } else if (b.floors) {
    for (const f of b.floors) {
      const rooms = ROOMS.filter(r => r.floor === f.id);
      html += `<p class="ch-floor-title">${escHtml(f.label)}</p>
        <div class="ch-rooms-grid" data-floor="${escHtml(f.id)}">
          ${rooms.map(r => roomCard(r, occ[r.id] || [])).join("")}
        </div>`;
    }
  }
  container.innerHTML = html;
  bindRoomCards(container);
  if (animate) animateRoomsIn(container);
}

function bindRoomCards(container) {
  container.querySelectorAll(".ch-room-card").forEach(card => {
    const rid  = card.dataset.rid;
    const room = ROOM_BY_ID[rid];
    const occs = Object.values(chAssign).filter(r => r === rid);
    const isFull = occs.length >= room.capacity;

    card.addEventListener("click", () => {
      if (!selectedGuestId || isFull) return;
      assignGuest(selectedGuestId, rid);
    });

    card.querySelectorAll(".ch-occupant-remove").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        removeGuest(btn.dataset.gid);
      });
    });

    card.querySelectorAll(".ch-occupant-row").forEach(row => {
      const gid = row.querySelector(".ch-occupant-remove")?.dataset.gid;
      if (!gid) return;
      row.setAttribute("draggable", "true");
      row.addEventListener("dragstart", (e) => {
        e.stopPropagation();
        dragGuestId = gid;
        e.dataTransfer.setData("text/plain", gid);
        e.dataTransfer.effectAllowed = "move";
        requestAnimationFrame(() => row.classList.add("is-dragging"));
      });
      row.addEventListener("dragend", () => {
        row.classList.remove("is-dragging");
        dragGuestId = null;
        document.querySelectorAll(".ch-room-card.drag-over").forEach(c => c.classList.remove("drag-over"));
      });
    });

    card.addEventListener("dragover", (e) => {
      if (!dragGuestId) return;
      if (chAssign[dragGuestId] === rid) return;
      const liveCount = Object.values(chAssign).filter(r => r === rid).length;
      if (liveCount >= room.capacity) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", (e) => {
      if (!card.contains(e.relatedTarget)) card.classList.remove("drag-over");
    });
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");
      const gid = e.dataTransfer.getData("text/plain") || dragGuestId;
      if (!gid) return;
      assignGuest(gid, rid);
      dragGuestId = null;
    });
  });
}

function renderHotspots() {
  const container = document.getElementById("chMapHotspots");
  if (!container) return;
  container.innerHTML = MAP_BUILDINGS.map(b => {
    const bsX = (10000 / b.w).toFixed(1);
    const bsY = (10000 / b.h).toFixed(1);
    const bpX = (b.l * 100 / (100 - b.w)).toFixed(1);
    const bpY = (b.t * 100 / (100 - b.h)).toFixed(1);

      style="left:${b.l}%;top:${b.t}%;width:${b.w}%;height:${b.h}%">
      <div class="ch-map-hotspot-bg" style="background-size:${bsX}% ${bsY}%;background-position:${bpX}% ${bpY}%"></div>

function openBuildingModal(bid) {
  const b = MAP_BUILDINGS.find(x => x.id === bid);
  if (!b) return;
  activeBuilding = b;
  const modal = document.getElementById("chBuildingModal");
  document.getElementById("chModalTitle").textContent = b.label;

  panel.style.animation = "none";
  void panel.offsetWidth;
  panel.style.animation = "";

function closeBuildingModal() {

  document.getElementById("chBuildingModal").classList.add("is-hidden");
}

function animateRoomsIn(grid) {
  const items = grid.querySelectorAll(".ch-room-card, .ch-chalet-block");
  items.forEach((el, i) => {
    el.style.opacity = "0";
    el.style.animation = "none";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.animation = `ch-card-in 0.22s ease ${i * 40}ms both`;
    }));
  });
}

function chaletBlock(chaletName, rooms, roomOccupants) {
  const totalCap = rooms.reduce((s, r) => s + r.capacity, 0);
  const totalOcc = rooms.reduce((s, r) => s + (roomOccupants[r.id] || []).length, 0);
  const allFull  = rooms.every(r => (roomOccupants[r.id] || []).length >= r.capacity);
  return `<div class="ch-chalet-block${allFull ? " is-full" : ""}">
    <div class="ch-chalet-header">
      <span class="ch-chalet-name">Chalet ${escHtml(chaletName)}</span>
      <span class="ch-chalet-cap">${totalOcc}/${totalCap}</span>
    </div>
    <div class="ch-chalet-rooms" style="grid-template-columns:repeat(${rooms.length},1fr)">
      ${rooms.map(r => roomCardCompact(r, roomOccupants[r.id] || [])).join("")}
    </div>
  </div>`;
}

function roomCardCompact(room, occupants) {
  const isFull  = occupants.length >= room.capacity;
  const pct     = room.capacity > 0 ? Math.round((occupants.length / room.capacity) * 100) : 0;
  const canDrop = selectedGuestId && !isFull;
  const classes = ["ch-room-card","is-compact",isFull?"is-full":"",canDrop?"can-drop":""].filter(Boolean).join(" ");
  const occupantRows = occupants.map(g =>
    `<div class="ch-occupant-row">
       <span>${escHtml(g.name)}</span>
       <button class="ch-occupant-remove" data-gid="${escHtml(g.id)}" title="Retirer">✕</button>
     </div>`
  ).join("");
  return `<div class="${classes}" data-rid="${escHtml(room.id)}">
    ${isFull ? `<span class="ch-room-badge-full">Complet</span>` : ""}
    <p class="ch-room-name">${escHtml(room.subName)}</p>
    <p class="ch-room-beds">${escHtml(room.beds)}</p>
    <div class="ch-room-capacity">
      <div class="ch-room-bar-wrap"><div class="ch-room-bar${isFull?" is-full":""}" style="width:${pct}%"></div></div>
      <span class="ch-room-cap-label">${occupants.length}/${room.capacity}</span>
    </div>
    <div class="ch-room-occupants">${occupantRows}</div>
  </div>`;
}

function roomCard(room, occupants) {
  const isFull    = occupants.length >= room.capacity;
  const pct       = room.capacity > 0 ? Math.round((occupants.length / room.capacity) * 100) : 0;
  const canDrop   = selectedGuestId && !isFull;
  const classes   = [
    "ch-room-card",
    isFull    ? "is-full"   : "",
    canDrop   ? "can-drop"  : "",
    room.bridal ? "is-bridal" : "",
  ].filter(Boolean).join(" ");

  const occupantRows = occupants.map(g =>
    `<div class="ch-occupant-row">
       <span>${escHtml(g.name)}</span>
       <button class="ch-occupant-remove" data-gid="${escHtml(g.id)}" title="Retirer">✕</button>
     </div>`
  ).join("");

  const noteHtml = room.note ? `<span class="ch-room-sdb" style="color:var(--gold-dark)">⚠ ${escHtml(room.note)}</span>` : "";

  return `<div class="${classes}" data-rid="${escHtml(room.id)}">
    ${isFull ? `<span class="ch-room-badge-full">Complet</span>` : ""}
    <p class="ch-room-name">${escHtml(room.name)}</p>
    <p class="ch-room-beds">${escHtml(room.beds)}</p>
    <p class="ch-room-sdb">SDB ${escHtml(room.sdb)}</p>
    ${noteHtml}
    <div class="ch-room-capacity">
      <div class="ch-room-bar-wrap">
        <div class="ch-room-bar${isFull ? " is-full" : ""}" style="width:${pct}%"></div>
      </div>
      <span class="ch-room-cap-label">${occupants.length}/${room.capacity}</span>
    </div>
    <div class="ch-room-occupants">${occupantRows}</div>
  </div>`;
}

function renderStats() {
  const hebergGuests = chGuests.filter(g => g.hebergement);
  const placed = hebergGuests.filter(g => chAssign[g.id]).length;
  const bedsUsed = Object.keys(chAssign).filter(gid => chGuests.find(g => g.id === gid)).length;
  const fullRooms = ROOMS.filter(r => {
    const occ = Object.values(chAssign).filter(rid => rid === r.id).length;
    return occ >= r.capacity && occ > 0;
  }).length;

  if (statPlaced) statPlaced.textContent = placed;
  if (statTotal)  statTotal.textContent  = hebergGuests.length;
  if (statBeds)   statBeds.textContent   = bedsUsed;
  if (statFull)   statFull.textContent   = fullRooms;
}

document.getElementById("chModalBackdrop")?.addEventListener("click", closeBuildingModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeBuildingModal(); });

// ── Recherche ────────────────────────────────────────────────────────────
chGuestSearch?.addEventListener("input", () => renderSidebar());

// ── Dark mode ────────────────────────────────────────────────────────────
const darkToggle = document.getElementById("chDarkToggle");
const isDark = localStorage.getItem("dark-mode") === "true";
if (isDark) document.body.classList.add("dark-mode");
darkToggle?.addEventListener("click", () => {
  const d = document.body.classList.toggle("dark-mode");
  localStorage.setItem("dark-mode", d);
  darkToggle.textContent = d ? "☀️" : "🌙";
});
if (isDark && darkToggle) darkToggle.textContent = "☀️";
</script>
</body>
</html>
